<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor 3D interactivo</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f7f7f7;font-family:Arial,sans-serif}
    model-viewer{display:block;width:100%;height:100%;min-height:360px;background:#f7f7f7;--progress-bar-color:#555}
  </style>
</head>
<body>
  <model-viewer src="./modelo.glb" alt="Modelo 3D interactivo" camera-controls auto-rotate rotation-per-second="20deg" shadow-intensity="1" exposure="1" touch-action="pan-y" interaction-prompt="auto" ar>
  </model-viewer>
</body>
</html>
