<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor 3D</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; background:transparent; overflow:hidden; font-family:Arial,sans-serif; }
    model-viewer { display:block; width:100%; height:100%; min-height:320px; background-color:transparent; --poster-color:transparent; }
    #mensaje { position:absolute; inset:0; display:grid; place-items:center; padding:20px; color:#555; text-align:center; pointer-events:none; }
  </style>
</head>
<body>
  <div id="mensaje">Cargando modelo 3D…</div>
  <model-viewer id="visor" alt="Modelo tridimensional interactivo"
    camera-controls auto-rotate rotation-per-second="20deg"
    shadow-intensity="1" exposure="1" interaction-prompt="auto" loading="eager">
  </model-viewer>
  <script>
    const modelo = new URLSearchParams(window.location.search).get("modelo");
    const visor = document.getElementById("visor");
    const mensaje = document.getElementById("mensaje");
    if (modelo) {
      visor.src = modelo;
      visor.addEventListener("load", () => mensaje.remove());
      visor.addEventListener("error", () => {
        mensaje.textContent = "No se pudo cargar el modelo. Comprueba el nombre y la ruta del archivo GLB.";
      });
    } else {
      mensaje.textContent = "Falta indicar el modelo: ?modelo=modelos/archivo.glb";
    }
  </script>
</body>
</html>
